{% extends 'base.html' %} {% block title %}Create Account — Reserve{% endblock %} {% block content %} <section
    class="auth-section">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h1> Create Account </h1>
            <p> Join Reserve. </p>
        </div>
        <form method="POST"> {% csrf_token %} <div class="mb-3"> <label class="form-label"> Full Name </label> <input
                    type="text" name="name" class="form-control" required> </div>
            <div class="mb-3"> <label class="form-label"> Email </label> <input type="email" name="email"
                    class="form-control" required> </div>
            <div class="mb-3"> <label class="form-label"> Password </label> <input type="password" name="password"
                    class="form-control" required> </div>
            <div class="form-check mb-4"> <input class="form-check-input" type="checkbox" id="terms" required> <label
                    class="form-check-label" for="terms"> I agree to the terms and privacy policy. </label> </div>
            <button class="btn btn-dark w-100 btn-lg"> Create Account </button>
        </form>
        <p class="text-center mt-4"> Already have an account? <a href="{% url 'login' %}"> Login </a> </p>
    </div>
</section>
{% endblock %}
