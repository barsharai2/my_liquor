{% extends 'base.html' %} {% block title %}Login — Reserve{% endblock %} {% block content %} <section
    class="auth-section">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h1> Welcome Back </h1>
            <p> Sign in to your account. </p>
        </div>
        <form method="POST"> {% csrf_token %} <div class="mb-3"> <label class="form-label"> Email </label> <input
                    type="email" name="email" class="form-control" required> </div>
            <div class="mb-3"> <label class="form-label"> Password </label> <input type="password" name="password"
                    class="form-control" required> </div>
            <div class="d-flex justify-content-between mb-4">
                <div class="form-check"> <input type="checkbox" class="form-check-input" id="remember"> <label
                        class="form-check-label" for="remember"> Remember me </label> </div> <a href="#"> Forgot
                    password? </a>
            </div> <button class="btn btn-dark w-100 btn-lg"> Login </button>
        </form>
        <p class="text-center mt-4"> Don't have an account? <a href="{% url 'register' %}"> Create one </a> </p>
    </div>
</section>
{% endblock %}
