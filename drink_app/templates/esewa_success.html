
{% extends 'base.html' %}

{% block title %}Payment Successful{% endblock %}

{% block content %}
<section class="section-padding">
    <div class="container text-center py-5">
        <i class="bi bi-check-circle-fill text-success fs-1"></i>

        <h1 class="mt-3">Payment Successful!</h1>
        <p>Your eSewa payment has been verified.</p>

        <p>
            Amount paid:
            <strong>Rs. {{ total|floatformat:2 }}</strong>
        </p>

        <p>
            Transaction ID:
            <strong>{{ transaction_uuid }}</strong>
        </p>

        <a href="{% url 'shop' %}" class="btn btn-dark mt-3">
            Continue Shopping
        </a>
    </div>
</section>
{% endblock %}
